name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate source extracts
        run: python scripts/generate_source_data.py
      - name: Build and test the warehouse
        run: dbt build --profiles-dir .
      - name: Export reports and charts
        run: python scripts/build_report.py
