name: kereru_dw
version: "1.0.0"
config-version: 2
profile: kereru_dw

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

vars:
  raw_path: "data/raw"   # where scripts/generate_source_data.py writes the source extracts
  gst_rate: 0.15         # New Zealand GST

models:
  kereru_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: core
      reporting:
        +materialized: table
        +schema: reporting

seeds:
  kereru_dw:
    +schema: core
    nz_public_holidays:
      +column_types:
        holiday_date: date
